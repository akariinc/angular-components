name: CI

on:
  push:
    branches:
      - main
      - '[0-9]+.[0-9]+.x'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Initialize environment
        uses: angular/dev-infra/github-actions/npm/checkout-and-setup-node@c584c3565b71c7a8cda81d55bb14e3e66ef934da
      - name: Install node modules
        run: pnpm install --frozen-lockfile
      - name: Checking package externals
        run: |
          bazel build //:package_externals
          pnpm check-package-externals $(bazel info bazel-bin)/package_externals.json
      - name: Checking entry-points configuration
        run: |
          bazel build //:entry_points_manifest
          pnpm check-entry-point-setup $(bazel info bazel-bin)/entry_points_manifest.json
      - name: Check OWNERS file
        run: pnpm ownerslint
      - name: Check for component id collisions
        run: pnpm detect-component-id-collisions
      - name: Check style lint
        run: pnpm stylelint
      - name: Check code lint
        run: pnpm tslint
      - name: Check for circular dependencies
        run: pnpm -s ts-circular-deps:check

  api_golden_checks:
    runs-on: ubuntu-latest
    steps:
      - name: Initialize environment
        uses: angular/dev-infra/github-actions/npm/checkout-and-setup-node@c584c3565b71c7a8cda81d55bb14e3e66ef934da
      - name: Setup Bazel
        uses: angular/dev-infra/github-actions/bazel/setup@c584c3565b71c7a8cda81d55bb14e3e66ef934da
      # - name: Setup Bazel RBE
      #   uses: angular/dev-infra/github-actions/bazel/configure-remote@c584c3565b71c7a8cda81d55bb14e3e66ef934da
      #   with:
      #     google_credential: ${{ secrets.RBE_TRUSTED_BUILDS_USER }}
      - name: Install node modules
        run: pnpm install --frozen-lockfile
      - name: Check API Goldens
        run: pnpm bazel test goldens/...

  # Turned down: needs more CI resources than the fork has available.
  # e2e:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Initialize environment
  #       uses: angular/dev-infra/github-actions/npm/checkout-and-setup-node@c584c3565b71c7a8cda81d55bb14e3e66ef934da
  #     - name: Setup Bazel
  #       uses: angular/dev-infra/github-actions/bazel/setup@c584c3565b71c7a8cda81d55bb14e3e66ef934da
  #     - name: Install node modules
  #       run: pnpm install --frozen-lockfile
  #     - name: Run e2e tests
  #       run: pnpm e2e --flaky_test_attempts=2

  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Initialize environment
        uses: angular/dev-infra/github-actions/npm/checkout-and-setup-node@c584c3565b71c7a8cda81d55bb14e3e66ef934da
      - name: Setup Bazel
        uses: angular/dev-infra/github-actions/bazel/setup@c584c3565b71c7a8cda81d55bb14e3e66ef934da
      # - name: Setup Bazel RBE
      #   uses: angular/dev-infra/github-actions/bazel/configure-remote@c584c3565b71c7a8cda81d55bb14e3e66ef934da
      #   with:
      #     google_credential: ${{ secrets.RBE_TRUSTED_BUILDS_USER }}
      - name: Install node modules
        run: pnpm install --frozen-lockfile
      - name: Run integration tests
        run: pnpm integration-tests
        continue-on-error: true

  # Turned down: ChromeHeadless karma tests cannot run on the available GitHub
  # runners (upstream uses ubuntu-latest-16core). Unit tests must be run locally.
  # test:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Initialize environment
  #       uses: angular/dev-infra/github-actions/npm/checkout-and-setup-node@c584c3565b71c7a8cda81d55bb14e3e66ef934da
  #     - name: Setup Bazel
  #       uses: angular/dev-infra/github-actions/bazel/setup@c584c3565b71c7a8cda81d55bb14e3e66ef934da
  #     - name: Install node modules
  #       run: pnpm install --frozen-lockfile
  #     - name: Run tests
  #       run: bazel test --build_tests_only --test_tag_filters=-linker-integration-test --test_tag_filters=-e2e -- //... -//goldens/... -//integration/...

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Initialize environment
        uses: angular/dev-infra/github-actions/npm/checkout-and-setup-node@c584c3565b71c7a8cda81d55bb14e3e66ef934da
      - name: Setup Bazel
        uses: angular/dev-infra/github-actions/bazel/setup@c584c3565b71c7a8cda81d55bb14e3e66ef934da
      # - name: Setup Bazel RBE
      #   uses: angular/dev-infra/github-actions/bazel/configure-remote@c584c3565b71c7a8cda81d55bb14e3e66ef934da
      #   with:
      #     google_credential: ${{ secrets.RBE_TRUSTED_BUILDS_USER }}
      - name: Install node modules
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: bazel build --build_tag_filters=-docs-package,-release-package -- src/...

  publish_snapshots:
    runs-on: ubuntu-latest
    steps:
      - name: Initialize environment
        uses: angular/dev-infra/github-actions/npm/checkout-and-setup-node@c584c3565b71c7a8cda81d55bb14e3e66ef934da
      - name: Setup Bazel
        uses: angular/dev-infra/github-actions/bazel/setup@c584c3565b71c7a8cda81d55bb14e3e66ef934da
      # - name: Setup Bazel RBE
      #   uses: angular/dev-infra/github-actions/bazel/configure-remote@c584c3565b71c7a8cda81d55bb14e3e66ef934da
      - name: Install node modules
        run: pnpm install --frozen-lockfile
      - name: Build and Verify Release Output
        run: pnpm build-and-check-release-output
      - name: Verify tooling setup
        run: pnpm check-tooling-setup
      - name: Build Docs Content
        run: pnpm build-docs-content
      - name: Publish Snapshots
        run: ./scripts/circleci/publish-snapshots.sh
        env:
          SNAPSHOT_BUILDS_GITHUB_TOKEN: ${{ secrets.SNAPSHOT_BUILDS_GITHUB_TOKEN }}

  # Turned down due to the lack of repository/accounts to deploy docs
  # deploy_doc_site: (see upstream ci.yml)

  # Turned down due to the lack of Browserstack account
  # browserstack: (see upstream ci.yml)
